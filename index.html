<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natchapol Patamawisut — Quantum Computing Researcher</title>
    <script>
      // Restore the URL encoded by public/404.html into ?p= before React Router mounts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('p');
        if (path) {
          params.delete('p');
          var qs = params.toString();
          window.history.replaceState(
            null, null,
            decodeURIComponent(path) + (qs ? '?' + qs : '') + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
